---
# Generic DAR-deploy tooling.
#
# Variables consumed (via Flux postBuild.substituteFrom):
#   ADMIN_NAMESPACE          namespace the Job runs in
#   CANTON_API_URL           Canton JSON API v2 base URL (in-cluster or ingress)
#   DAR_PACKAGE_NAME         DAML package name (daml.yaml `name:`)
#   DAR_VERSION              version the Job expects the DAR ConfigMaps to hold
#   DAR_DEPLOY_JOB_VERSION   bump on EVERY change to the Job spec, the scripts,
#                            or the DAR ConfigMaps (Job specs are immutable —
#                            see dar-deploy-job.yaml header)
#
# Also requires in ${ADMIN_NAMESPACE}:
#   Secret     canton-admin-token   key `token` — an admin bearer token for
#                                   the JSON API (consumer-supplied)
#   ConfigMaps dar-part1..dar-part3 — generated by scripts/gen-dar-configmaps.sh
#              in YOUR repo (they hold your application's DAR; never commit a
#              DAR to this public base)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${ADMIN_NAMESPACE}

resources:
  - dar-deploy-job.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: dar-deploy-scripts
    files:
      - scripts/dar-deploy.sh
      - scripts/wait-for-canton.sh
      - scripts/wait-for-validator.sh
