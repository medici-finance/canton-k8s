---
# DEV ONLY — allow the admin/debug pod's ServiceAccount (see admin/) to read
# pods and pod logs in the canton namespace, so participant/keycloak logs can
# be inspected from the debug pod without cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: debug-pod-log-reader
  namespace: ${CANTON_NAMESPACE}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: debug-pod-log-reader
  namespace: ${CANTON_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: debug-pod-log-reader
subjects:
  - kind: ServiceAccount
    name: canton-admin
    namespace: ${ADMIN_NAMESPACE}
