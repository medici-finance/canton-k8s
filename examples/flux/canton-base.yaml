---
# How a consuming (private) repo pulls this public base in via Flux.
#
# SUPPLY-CHAIN RULE: pin the GitRepository to a TAG or COMMIT SHA — never a
# moving branch. This repo is a public source; a branch ref would let any
# future commit (or a compromised one) flow straight into your cluster.
# Review, then bump the pin deliberately.
#
# AND WATCH FOR UPDATES. A pin you never bump is a deployment frozen on the day
# you adopted it, security fixes included, and Flux will not tell you. Watch
# this repo's Releases and Security advisories — see docs/usage.md,
# "Then watch for updates".
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: canton-splice-base
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/medici-finance/canton-k8s
  ref:
    # Pin by commit — the immutable form, and the one to copy. A commit SHA
    # cannot be re-pointed; `commit` also takes precedence over every other
    # ref field, so it cannot be quietly widened by an edit elsewhere.
    commit: 2ede9ac73f9c6881d9d38f5e3b2c9913f67610ca   # = tag v0.1.1
    # …or by tag, which reads better in review but CAN be moved to a different
    # commit upstream, and Flux follows it:
    # tag: v0.1.1
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: canton-dev
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: canton-splice-base
  # Point at the base directly, or at YOUR overlay directory in your own repo
  # (which references the base by path) if you keep overlays privately.
  path: ./examples/overlays/dev
  prune: true
  wait: false
  timeout: 5m
  postBuild:
    substituteFrom:
      # Non-secret env scalars (namespace, hostnames, sizes) — a plain
      # ConfigMap in YOUR repo. See examples/env-config.yaml.
      - kind: ConfigMap
        name: canton-env-config
      # Anything sensitive you want substituted (none required by this base —
      # all credential material is consumed as k8s Secrets by name, not
      # substituted into manifests). Slot kept here to show the pattern.
      - kind: Secret
        name: canton-env-secrets
        optional: true
