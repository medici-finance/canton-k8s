---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: ${CANTON_NAMESPACE}
  labels:
    app: keycloak
spec:
  ports:
    - port: 8080
      name: http
  selector:
    app: keycloak
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: ${CANTON_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
      annotations:
        # Bump ${REALM_CHECKSUM} (in your env ConfigMap) whenever the realm
        # ConfigMap changes AND you need the change re-imported. With
        # KEYCLOAK_DB_RESET=enabled (dev) the bump triggers a DB drop + fresh
        # realm import on the next rollout; with KEYCLOAK_DB_RESET=disabled
        # (prod) an existing realm is NOT re-imported — apply realm changes
        # through the Keycloak admin API instead.
        realm-checksum: "${REALM_CHECKSUM}"
    spec:
      initContainers:
        - name: db-init
          image: postgres:14
          command:
            - sh
            - -c
            - |
              set -e
              export PGPASSWORD="$${KC_INIT_PG_ADMIN_PASSWORD}"
              echo "Waiting for postgres..."
              until psql -h "$${KC_INIT_PG_HOST}" -U cnadmin -d cantonnet -c "SELECT 1" > /dev/null 2>&1; do
                echo "  still waiting..."
                sleep 2
              done
              echo "Postgres is ready."

              # Create role if not exists
              psql -h "$${KC_INIT_PG_HOST}" -U cnadmin -d cantonnet -tc \
                "SELECT 1 FROM pg_catalog.pg_roles WHERE rolname='$${KC_INIT_DB_USER}'" 2>/dev/null | grep -q 1 || \
              psql -h "$${KC_INIT_PG_HOST}" -U cnadmin -d cantonnet -c \
                "CREATE ROLE \"$${KC_INIT_DB_USER}\" WITH LOGIN PASSWORD '$${KC_INIT_DB_PASSWORD}'"

              if [ "$${KC_INIT_RESET_DB}" = "enabled" ]; then
                # DEV MODE ONLY: drop the Keycloak database if it exists —
                # forces a fresh realm import on every restart so realm
                # ConfigMap changes (redirectUris, mappers, clients) take
                # effect. WITH (FORCE) kills any stale connections.
                # This DESTROYS all Keycloak state (users, sessions) — never
                # enable it on an environment with real users.
                echo "KC_INIT_RESET_DB=enabled — recreating Keycloak database..."
                psql -h "$${KC_INIT_PG_HOST}" -U cnadmin -d cantonnet -c \
                  "DROP DATABASE IF EXISTS keycloakdb WITH (FORCE)"
              fi

              # Create database if not exists, owned by the keycloak user
              psql -h "$${KC_INIT_PG_HOST}" -U cnadmin -d cantonnet -tc \
                "SELECT 1 FROM pg_catalog.pg_database WHERE datname='keycloakdb'" 2>/dev/null | grep -q 1 || \
              psql -h "$${KC_INIT_PG_HOST}" -U cnadmin -d cantonnet -c \
                "CREATE DATABASE keycloakdb OWNER \"$${KC_INIT_DB_USER}\""

              echo "Keycloak database and user are ready."
          env:
            - name: KC_INIT_PG_HOST
              value: postgres.${CANTON_NAMESPACE}.svc.cluster.local
            - name: KC_INIT_RESET_DB
              value: "${KEYCLOAK_DB_RESET}"
            - name: KC_INIT_PG_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: postgresPassword
            - name: KC_INIT_DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: username
            - name: KC_INIT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: password
        # Template the realm import file: envsubst injects client secrets and
        # bootstrap-user passwords from the keycloak-credentials Secret into
        # the realm JSON. Only the variables exported below are substituted —
        # extend BOTH the export list and the env list when your (consumer)
        # realm overlay adds clients.
        - name: realm-import
          image: alpine:latest
          command:
            - sh
            - -c
            - |
              set -e
              apk add --no-cache gettext > /dev/null 2>&1
              echo "Templating realm.json with Secret values..."
              export APP_USER_VALIDATOR_CLIENT_SECRET APP_USER_SV_CLIENT_SECRET APP_USER_PASSWORD ADMIN_PASSWORD VALIDATOR_APP_BACKEND_CLIENT_SECRET
              # Substitute ONLY these five secret placeholders. A bare `envsubst`
              # replaces every ${...} it finds, and an UNDEFINED variable expands to
              # the EMPTY STRING — so a client added to the realm without extending
              # the export/env lists imports with secret "", silently weakening auth
              # instead of failing. The allow-list leaves anything unexpected intact
              # so the check below can catch it. ($$ escapes Flux postBuild, matching
              # the kc-db-init container above.)
              envsubst '$${APP_USER_VALIDATOR_CLIENT_SECRET} $${APP_USER_SV_CLIENT_SECRET} $${APP_USER_PASSWORD} $${ADMIN_PASSWORD} $${VALIDATOR_APP_BACKEND_CLIENT_SECRET}' \
                < /etc/realm/realm.json > /opt/keycloak/data/import/realm.json
              # Fail CLOSED. A surviving placeholder means a value was never supplied:
              # either a secret missing from this container's env, or a Flux postBuild
              # variable the consumer's ConfigMap does not define — those land
              # literally rather than erroring (docs/usage.md, "fails soft"). Importing
              # such a realm weakens auth quietly, so abort the rollout loudly.
              # -F (fixed string) is deliberate: as a BASIC regex, '$${' is read as an
              # interval operator by BSD/GNU grep and matches NOTHING, so the unescaped
              # form silently never fires — a fail-closed check that always passes.
              if grep -qF '$${' /opt/keycloak/data/import/realm.json; then
                echo "ERROR: realm.json still contains unsubstituted placeholders — refusing to import." >&2
                echo "Supply these via the realm-import env (secrets) or Flux postBuild (everything else):" >&2
                grep -oE '\$$\{[A-Za-z_][A-Za-z0-9_]*\}' /opt/keycloak/data/import/realm.json | sort -u >&2
                exit 1
              fi
              echo "Realm import file ready."
          env:
            - name: APP_USER_VALIDATOR_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: app-user-validator-client-secret
            - name: APP_USER_SV_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: app-user-sv-client-secret
            - name: APP_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: app-user-password
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: admin-realm-password
            - name: VALIDATOR_APP_BACKEND_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: validator-app-backend-client-secret
          volumeMounts:
            - name: realm-template
              mountPath: /etc/realm
            - name: realm-import
              mountPath: /opt/keycloak/data/import
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.1.0
          args: ["start-dev", "--import-realm"]
          ports:
            - containerPort: 8080
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: admin-user
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: admin-password
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: postgres.${CANTON_NAMESPACE}.svc.cluster.local
            - name: KC_DB_URL_PORT
              value: "5432"
            - name: KC_DB_URL_DATABASE
              value: keycloakdb
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: password
            - name: KC_PROXY_HEADERS
              value: xforwarded
            # The PUBLIC base URL. Pins every frontend URL the server
            # generates, so tokens minted here carry
            # iss=https://${KEYCLOAK_HOST}/auth/realms/<realm> whatever Host
            # header the request arrived with — that `iss` must match the
            # issuer the participant's IdP config expects, while the
            # participant fetches the JWKS over in-cluster HTTP (see
            # release-participant.yaml).
            #
            # This is the hostname-v2 model. Keycloak 25 introduced it and
            # 26.0 REMOVED v1, so under the 26.1 image above the v1 names
            # (KC_HOSTNAME_URL / KC_HOSTNAME_ADMIN_URL) are not options at all:
            # they are accepted as env vars and then ignored, which is why the
            # pinning this base documents has to be expressed as KC_HOSTNAME.
            # Notes on what is deliberately NOT set here:
            #   * hostname-admin — only needed when a proxy exposes the admin
            #     console on a *different* address than KC_HOSTNAME. It is the
            #     same address here, so KC_HOSTNAME already covers it.
            #   * hostname-strict — inert once hostname is a full URL ("If
            #     hostname is specified, hostname-strict is effectively
            #     ignored"). Under v2 its default is true and `"false"` is the
            #     switch that re-enables Host-header-derived URLs, i.e. exactly
            #     what this pinning exists to prevent — so it is gone, not
            #     carried over.
            #   * hostname-backchannel-dynamic — the v2 default (false) makes
            #     backchannel URLs equal the frontend ones, so even a token
            #     minted over the in-cluster address carries the public `iss`.
            #     Setting it true would hand in-cluster callers an in-cluster
            #     issuer no IdP config matches. It does NOT affect the
            #     issuer/JWKS split: every JWKS consumer in this base is given
            #     an explicit in-cluster jwksUrl and never uses OIDC discovery.
            # The URL's path REPLACES the request context path in generated
            # URLs (it is not appended), so it must match KC_HTTP_RELATIVE_PATH
            # below — keep both on /auth, or change both together.
            - name: KC_HOSTNAME
              value: https://${KEYCLOAK_HOST}/auth
            - name: KC_HTTP_RELATIVE_PATH
              value: /auth
            - name: KC_HEALTH_ENABLED
              value: "true"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
      volumes:
        - name: realm-template
          configMap:
            name: keycloak-realm
        - name: realm-import
          emptyDir: {}
