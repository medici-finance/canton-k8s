---
# CORS NOTE (applies to all three ingresses in this file): the
# `traefik.ingress.kubernetes.io/router.middlewares` annotation is read ONLY by
# Traefik. `${INGRESS_CLASS}` does not carry it — on any other controller the
# annotation is inert and these APIs serve no CORS headers at all. See
# traefik-cors.yaml and docs/usage.md sharp edge 7 for the non-Traefik swap.
#
# Keycloak — ${KEYCLOAK_HOST}
# TLS is served from the shared wildcard cert (${TLS_SECRET_NAME}, see
# certificate.yaml). No cert-manager.io/cluster-issuer annotation here —
# we do NOT want ingress-shim auto-creating a per-host Certificate
# (see the rate-limit note in certificate.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-api
  namespace: ${CANTON_NAMESPACE}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: ${KEYCLOAK_HOST}
    external-dns.alpha.kubernetes.io/target: ${EXTERNAL_DNS_TARGET}
    traefik.ingress.kubernetes.io/router.middlewares: ${CANTON_NAMESPACE}-cors-headers@kubernetescrd
spec:
  ingressClassName: ${INGRESS_CLASS}
  tls:
    - hosts:
        - ${KEYCLOAK_HOST}
      secretName: ${TLS_SECRET_NAME}
  rules:
    - host: ${KEYCLOAK_HOST}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
---
# Canton Participant JSON API — ${CANTON_API_HOST}
